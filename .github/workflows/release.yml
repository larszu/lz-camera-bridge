name: Release

# Installer fuer Windows und macOS aus einem Tag — dieselbe Form wie im
# cable-planner, angepasst an den Zuschnitt DIESES Repos.
#
# WAS HIER GEBAUT WIRD, IST NICHT DIE BRIDGE. Es ist die Desktop-Huelle
# (`packages/electron-app`), die das Web-RCP (`packages/web-rcp`) mitbringt
# und lokal ausliefert. Die Bridge selbst laeuft dort, wo die Kameras sind;
# `useBridge.ts` sucht sie unter demselben Host, unter dem die Oberflaeche
# geladen wurde. Ein Installer, der die Bridge mitbrachte, waere ein zweites
# Exemplar davon — und zwei Bridges am selben Kamerabus sind ein Defekt und
# kein Merkmal.
#
# `--publish never`: electron-builder soll NICHT selbst veroeffentlichen. Das
# Release baut der `release`-Job aus den eingesammelten Artefakten, damit ein
# halb fertiger Lauf keine halbe Release-Seite hinterlaesst.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      # Kein fail-fast: bricht macOS ab, will man die fertige Windows-Datei
      # trotzdem sehen — sonst sucht man den Fehler in beiden Jobs.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: electron:dist
          - os: macos-latest
            name: macos
            script: electron:dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: package.json auf die Tag-Version bringen
        # WARUM DAS HIER STEHT: electron-builder liest die Version aus
        # packages/electron-app/package.json und schreibt sie in JEDEN
        # Dateinamen ("LZ Camera Bridge-X.Y.Z.exe"). Der Tag dagegen wird von
        # Hand gesetzt. Die beiden driften unweigerlich auseinander -- bei
        # v1.1.0 stand im Baum 1.0.1, und haette der Build damals nicht ohnehin
        # abgebrochen, waere ein Release "v1.1.0" mit Dateien namens "1.0.1"
        # herausgekommen. Das faellt niemandem auf, bis jemand den falschen
        # Installer ausrollt.
        #
        # `npm version --no-git-tag-version` schreibt nur die Dateien, ohne
        # Commit und ohne Tag -- im Runner, nicht im Repo. Es korrigiert also
        # den Dateinamen, nicht die Historie. Wer die Version dauerhaft
        # nachziehen will, tut das in einem eigenen Commit.
        #
        # `--allow-same-version`, damit der Schritt nicht scheitert, wenn im
        # Baum ohnehin schon die Tag-Version steht (der Normalfall).
        #
        # Bei workflow_dispatch gibt es keinen Tag -- dann wird uebersprungen.
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag-Version: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version --workspaces --include-workspace-root
          node -e "console.log('electron-app nach dem Sync:', require('./packages/electron-app/package.json').version)"

      - name: Package
        # `shell: bash` auf JEDEM Betriebssystem, und das ist hier der Punkt.
        # Im cable-planner hat die Windows-Standardshell (pwsh) Ausgabe UND
        # Exit-Code von electron-builder verschluckt: der Schritt war nach
        # 1,5 s ohne eine Zeile Ausgabe "erfolgreich", und der Job scheiterte
        # erst beim Hochladen, weil nichts gebaut worden war.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_IDENTITY_AUTO_DISCOVERY wird BEWUSST nicht gesetzt — der
          # Grund steht am mac-Block in packages/electron-app/electron-builder.yml.
        run: npm run ${{ matrix.script }}

      - name: Inhalt von release/ zeigen
        shell: bash
        run: ls -lh packages/electron-app/release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lz-camera-bridge-${{ matrix.name }}
          path: |
            packages/electron-app/release/*.exe
            packages/electron-app/release/*.dmg
          # Laut scheitern statt ein leeres Artefakt hochzuladen.
          if-no-files-found: error

  release:
    name: Release anlegen
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Artefakte holen
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Release-Vollstaendigkeit pruefen
        # Der Fall, gegen den das geschrieben ist, ist im cable-planner
        # passiert: ein Release mit NULL Assets, fuenf Wochen lang unbemerkt,
        # weil die Release-Seite dabei aussieht wie jede andere.
        #
        # Geprueft wird nicht "irgendetwas ist da" (das sichert
        # `if-no-files-found: error` je Job), sondern dass JEDE Gattung da
        # ist. Kein zip/latest*.yml wie im cable-planner: dort braucht die
        # ein Auto-Updater, den es hier nicht gibt — eine Zeile fuer eine
        # Datei, die niemand baut, waere ein Dauer-Fehlalarm.
        shell: bash
        run: |
          set -eu
          echo "--- heruntergeladene Artefakte ---"
          find artifacts -type f | sort
          echo "----------------------------------"
          fehlt=0
          pruefe() {
            anzahl="$(find artifacts -type f -name "$1" | wc -l | tr -d ' ')"
            if [ "$anzahl" -ge "$2" ]; then
              echo "ok   $1 ($anzahl, erwartet mindestens $2)"
            else
              echo "FEHLT $1 -- $3 (gefunden: $anzahl, erwartet mindestens $2)"
              fehlt=1
            fi
          }
          pruefe '*.exe' 1 'Windows-Installer (NSIS, windows-Job)'
          pruefe '*.dmg' 2 'macOS: je ein DMG fuer Intel und Apple Silicon (macos-Job)'
          if [ "$fehlt" -ne 0 ]; then
            echo
            echo "Ein halbes Release ist schlimmer als keines: es sieht auf der"
            echo "Release-Seite vollstaendig aus. Erst den fehlenden Build-Job"
            echo "reparieren, dann den Tag neu setzen."
            exit 1
          fi

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
