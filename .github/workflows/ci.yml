# ───────────────────────────────────────────────────────────────────────────
# CI — 15 Tests, die bis hierher nur lokal liefen.
#
# Das Repo hatte keine CI. Vorhanden sind aber zwei Test-Suiten mit zusammen
# 15 Pruefungen (`packages/bridge`: 8, `packages/companion-module-*`: 7), und
# sie halten ausgerechnet die Zusicherung fest, die dieses Projekt teuer
# gelernt hat: ADR-003, "unbestaetigt ist nicht aus".
#
# Die Testnamen sagen es selbst -- "eine 200-Antwort ohne tally-Feld behauptet
# nichts", "eine TEILWEISE Antwort fuellt die uebrigen Felder nicht mit false
# auf", "der Anfangszustand ist unbekannt, nicht aus". Genau diese Aussagen
# duerfen nicht unbemerkt kippen: ein Tally-Licht, das faelschlich AUS zeigt,
# schickt jemanden vor eine laufende Kamera.
# ───────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (alle Workspaces)
        run: npm test

      # Fragt die action.yml jedes Pins nach ihrer Node-Version, statt sie in
      # einem Kommentar zu behaupten. Am 2026-09-05 liefen hier BEIDE Actions
      # auf dem abgekuendigten node20, und niemandem ist es aufgefallen -- die
      # Warnung steht am Ende jedes Laufs, und genau deshalb liest sie keiner.
      - name: package-lock traegt alle Bau-Plattformen
        # Am 2026-09-16 hat eine unter Linux neu erzeugte Lockfile die
        # optionalen Pakete fremder Plattformen verloren (von 25
        # @rollup/rollup-* blieben zwei uebrig). Lokal faellt das nie auf --
        # der Release-Lauf starb dafuer in BEIDEN Jobs, Windows wie macOS,
        # bevor eine einzige Datei entstand. Dieser Schritt laeuft frueh,
        # weil er in Millisekunden sagt, was sonst zwei Runner und zehn
        # Minuten kostet.
        run: npm run lock:check

      - name: Actions laufen auf einer unterstuetzten Node-Version
        run: npm run actions:check

      # Nutzer-Rueckmeldung 2026-09-07: "die ui ist nicht konsistent. lege
      # globale ui regeln fest die fuer alle repos gelten." Die Regeln stehen
      # in ADR-007 der av-planner-suite; dieser Check haelt sie hier — fuer
      # das Dashboard. Die Nachbauten der Sony-Steuersoftware und der
      # AW-RP150 bleiben ausdruecklich draussen.
      - name: Oberflaechen-Regeln (ADR-007)
        run: npm run brand:check

      # An den Reglern haengen Schwenk-/Neige-Geschwindigkeit, Zoom, Blende
      # und Verstaerkung einer Kamera, die im Zweifel gerade auf Sendung ist.
      # Wer danebengreift, verreisst ein Bild, das Zuschauer sehen.
      # WCAG 2.2 SC 2.5.8 (Stufe AA) nennt 24 px.
      - name: Schieberegler sind zu treffen (24 px, WCAG 2.5.8)
        run: npm run slider:check

      # EIN PULT-TABLET IST DER NORMALFALL, nicht die Ausnahme — so steht es
      # woertlich im Quelltext der Bruecke, und sie bindet deshalb jede
      # Schnittstelle und nennt beim Start ihre LAN-Adressen. Die
      # OBERFLAECHE, die dieses Tablet oeffnen soll, lag bis 2026-09-15 auf
      # `localhost`; Vite sagte es bei jedem Start („Network: use --host to
      # expose") und niemand las es als Befund. Eine Zusage, die zur Haelfte
      # eingeloest ist, ist keine — wer sie aufbaut, steht vor einer Seite,
      # die nicht aufgeht, und sucht den Fehler im WLAN.
      - name: Bruecke und Pult sind beide im Netz
        run: npm run netz:check

      # E-17/E-20 + B-26: dieses Repo ist englisch-quellig, und die deutschen
      # Reste in der Oberflaeche sind ein SPRACHMIX, kein Rueckstand — derselbe
      # Dialog zeigt beides. Der Lauf haelt ihre Zahl bei der Grenze, die beim
      # Einfuehren gemessen wurde: der Bestand darf bleiben, solange B-26 offen
      # ist, wachsen darf er nicht.
      - name: Quellsprache und Sprachmix
        run: npm run lang:check

      # BEDARF 48 — der multicam-planner traegt eine KOPIE des Paint-Teils von
      # `packages/web-rcp/src/capabilities.ts`, weil er zur Planungszeit
      # kennzeichnet, wo sich Farbtemperatur und Schwarzabgleich nicht
      # fernstellen lassen. Laeuft die Kopie weg, steht auf einem gedruckten
      # Blatt eine Zusicherung, die dieses Repo nie gegeben hat.
      #
      # Der Checkout gelingt mit dem Standard-Token, weil larszu/multicam-planner
      # OEFFENTLICH ist. Umgekehrt ging es nicht: in der Suite scheiterte
      # derselbe Guard am Checkout DIESES Repos ("Not Found", Lauf
      # 34092050711) — privat, und ein fremdes GITHUB_TOKEN kommt nicht heran.
      # Er hat sich dort uebersprungen und der Job war gruen.
      - name: Checkout multicam-planner
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: larszu/multicam-planner
          path: upstream/multicam-planner

      - name: Faehigkeits-Tabelle des multicam-planners stimmt noch
        run: npm run caps:parity -- --planner upstream/multicam-planner
