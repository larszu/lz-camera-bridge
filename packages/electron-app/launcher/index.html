<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>LZ Camera Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #16161e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    /* ── Title bar ── */
    .titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 8px;
      gap: 4px;
      flex-shrink: 0;
    }
    .titlebar__btn {
      -webkit-app-region: no-drag;
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      color: #888;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .titlebar__btn:hover { background: rgba(255,255,255,0.08); color: #ccc; }
    .titlebar__btn--close:hover { background: #c0392b; color: #fff; }

    /* ── Center card ── */
    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 32px 24px;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(145deg, #c0392b, #e74c3c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(231,76,60,0.4);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #f0f0f0;
    }
    .version {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
      margin-bottom: 24px;
    }

    /* ── Service list ── */
    .services {
      width: 100%;
      background: #1e1e2a;
      border-radius: 12px;
      padding: 8px 0;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .service {
      display: flex;
      align-items: center;
      padding: 9px 18px;
      gap: 12px;
      font-size: 13.5px;
      transition: background 0.1s;
    }
    .service:hover { background: rgba(255,255,255,0.03); }

    .service__icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .service__icon--pending {
      border: 2px solid #444;
    }
    .service__icon--ok {
      background: #27ae60;
      color: #fff;
    }
    .service__icon--spin {
      border: 2px solid #3498db;
      border-top-color: transparent;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .service__name {
      flex: 1;
      color: #ccc;
    }
    .service__detail {
      font-size: 12px;
      color: #27ae60;
    }

    /* ── Port links ── */
    .port-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      align-items: center;
      margin-bottom: 20px;
    }
    .port-link {
      -webkit-app-region: no-drag;
      font-size: 13px;
      color: #27ae60;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s;
    }
    .port-link:hover { color: #2ecc71; text-decoration: underline; }
    .port-link--disabled { color: #444; pointer-events: none; }

    /* ── Buttons ── */
    .btn-row {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn--primary {
      background: #2563eb;
      color: #fff;
    }
    .btn--primary:hover { background: #1d4ed8; }
    .btn--primary:disabled { background: #1e3a6a; color: #555; cursor: not-allowed; }
    .btn--secondary {
      background: #2a2a3a;
      color: #bbb;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn--secondary:hover { background: #333348; color: #ddd; }
    .btn--danger {
      background: transparent;
      color: #e74c3c;
      border: 1px solid #e74c3c;
    }
    .btn--danger:hover { background: rgba(231,76,60,0.12); }

    /* ── Logs overlay ── */
    .logs-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d14;
      flex-direction: column;
      padding: 16px;
      z-index: 100;
    }
    .logs-overlay.visible { display: flex; }
    .logs-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .logs-header h2 { flex: 1; font-size: 14px; color: #aaa; }
    .logs-close {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #777;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .logs-close:hover { color: #ccc; }
    .logs-area {
      flex: 1;
      background: #111118;
      border-radius: 8px;
      padding: 10px 12px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: #7ec8a0;
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>
  <!-- Title bar -->
  <div class="titlebar">
    <button class="titlebar__btn" id="btnSettings" title="Settings">⚙</button>
    <button class="titlebar__btn" id="btnLogs" title="Logs">📋</button>
  </div>

  <!-- Main card -->
  <div class="card">
    <div class="app-icon">📷</div>
    <h1>LZ Camera Bridge</h1>
    <div class="version" id="version">v1.0.0</div>

    <!-- Service status list -->
    <div class="services">
      <div class="service">
        <div class="service__icon service__icon--pending" id="icon-core"></div>
        <span class="service__name">Core Server</span>
      </div>
      <div class="service">
        <div class="service__icon service__icon--pending" id="icon-license"></div>
        <span class="service__name">License Check</span>
      </div>
      <div class="service">
        <div class="service__icon service__icon--pending" id="icon-modules"></div>
        <span class="service__name">Loading Modules</span>
      </div>
      <div class="service">
        <div class="service__icon service__icon--pending" id="icon-web"></div>
        <span class="service__name">Web Server (HTTP)</span>
        <span class="service__detail" id="detail-web" style="display:none"></span>
      </div>
      <div class="service">
        <div class="service__icon service__icon--pending" id="icon-bridge"></div>
        <span class="service__name">Bridge WebSocket</span>
        <span class="service__detail" id="detail-bridge" style="display:none"></span>
      </div>
    </div>

    <!-- Clickable port links -->
    <div class="port-links">
      <a class="port-link port-link--disabled" id="link-ui" href="#" onclick="return false;">http://localhost:5997</a>
    </div>

    <!-- Action buttons -->
    <div class="btn-row">
      <button class="btn btn--primary" id="btnOpen" disabled>Open ↗</button>
      <button class="btn btn--secondary" id="btnConfig">Config</button>
      <button class="btn btn--secondary" id="btnLogsBtn">Logs</button>
      <button class="btn btn--danger" id="btnQuit">Quit</button>
    </div>
  </div>

  <!-- Logs overlay -->
  <div class="logs-overlay" id="logsOverlay">
    <div class="logs-header">
      <h2>Logs</h2>
      <button class="logs-close" id="logsClose">✕</button>
    </div>
    <div class="logs-area" id="logsArea"></div>
  </div>

  <script>
    const api = window.bridge;

    let uiPort = 5997;
    let bridgePort = 9700;
    let isReady = false;

    // ── Service icon helpers ──────────────────────────────────────────────────
    function setOk(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'service__icon service__icon--ok';
      el.textContent = '✓';
    }
    function setSpin(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'service__icon service__icon--spin';
      el.textContent = '';
    }

    // ── Status updates ────────────────────────────────────────────────────────
    api.onStatus((status) => {
      if (status.coreServer)      setOk('icon-core');      else setSpin('icon-core');
      if (status.licenseCheck)    setOk('icon-license');   else setSpin('icon-license');
      if (status.loadingModules)  setOk('icon-modules');   else setSpin('icon-modules');
      if (status.webServer) {
        setOk('icon-web');
        setOk('icon-bridge');
        const dw = document.getElementById('detail-web');
        const db = document.getElementById('detail-bridge');
        if (dw) { dw.style.display = ''; dw.textContent = `Running on http://localhost:${uiPort}`; }
        if (db) { db.style.display = ''; db.textContent = `ws://localhost:${bridgePort}`; }
      }
    });

    api.onReady((ports) => {
      uiPort = ports.uiPort;
      bridgePort = ports.bridgePort;
      isReady = true;

      const linkUi = document.getElementById('link-ui');
      if (linkUi) {
        linkUi.textContent = `http://localhost:${uiPort}`;
        linkUi.classList.remove('port-link--disabled');
        linkUi.onclick = (e) => { e.preventDefault(); api.openUi(); };
      }

      const btnOpen = document.getElementById('btnOpen');
      if (btnOpen) btnOpen.disabled = false;
    });

    api.onLog((line) => {
      const area = document.getElementById('logsArea');
      if (area) {
        area.textContent += line + '\n';
        area.scrollTop = area.scrollHeight;
      }
    });

    // ── Buttons ───────────────────────────────────────────────────────────────
    document.getElementById('btnOpen').addEventListener('click', () => {
      if (isReady) api.openUi();
    });

    document.getElementById('btnQuit').addEventListener('click', () => api.quit());

    const showLogs = () => {
      const overlay = document.getElementById('logsOverlay');
      overlay.classList.add('visible');
      // Load existing logs
      api.getLogs().then((text) => {
        const area = document.getElementById('logsArea');
        if (area && text) area.textContent = text;
      });
    };
    document.getElementById('btnLogs').addEventListener('click', showLogs);
    document.getElementById('btnLogsBtn').addEventListener('click', showLogs);
    document.getElementById('logsClose').addEventListener('click', () => {
      document.getElementById('logsOverlay').classList.remove('visible');
    });

    document.getElementById('btnConfig').addEventListener('click', () => {
      api.openUi(); // Opens the web UI which has config panel built-in
    });

    document.getElementById('btnSettings').addEventListener('click', () => {
      api.openUi();
    });

    // ── Load initial state ────────────────────────────────────────────────────
    api.getPorts().then((ports) => {
      uiPort = ports.ui;
      bridgePort = ports.bridge;
      document.getElementById('link-ui').textContent = `http://localhost:${uiPort}`;
    });

    api.getStatus().then((status) => {
      if (status.coreServer)     setOk('icon-core');
      if (status.licenseCheck)   setOk('icon-license');
      if (status.loadingModules) setOk('icon-modules');
      if (status.webServer)      { setOk('icon-web'); setOk('icon-bridge'); }
    });
  </script>
</body>
</html>
