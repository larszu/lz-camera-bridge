appId: com.camerabridge.app
productName: Camera Bridge
copyright: Copyright © 2026

# npmRebuild MUSS hier false sein, sonst schlaegt JEDER Release-Build fehl --
# und zwar destruktiv. Grund ist der Monorepo-Zuschnitt DIESES Repos:
#
# electron-builder prueft in app-builder-lib/util/yarn.js, ob im appDir
# (packages/electron-app) ein `node_modules` liegt. Liegt keines da, haelt es
# die Produktions-Abhaengigkeiten fuer nicht installiert und ruft
# `npm install --production` im appDir auf. Hier liegt aber NIE ein lokales
# node_modules: es ist ein npm-Workspace, alles wird ins Repo-Root gehoistet.
# Das `npm install --production` laeuft damit gegen den Workspace-Root und
# entfernt dort ALLE devDependencies aus dem gemeinsamen node_modules --
# electron-builder und app-builder-bin eingeschlossen. Direkt danach will
# electron-builder `app-builder` starten, das es sich selbst geloescht hat:
# `spawn .../app-builder-bin/<os>/app-builder ENOENT`, auf jedem OS.
# (cable-planner ist ein Single-Package-Repo: dort existiert node_modules im
# appDir, der Zweig wird nie betreten, deshalb faellt es dort nicht auf.)
#
# false ueberspringt install UND rebuild ("skipped dependencies rebuild").
#
# Seit die Bruecke mitgeliefert wird, HAT die App native Abhaengigkeiten
# (serialport, optional usb/node-hid) -- der Verzicht auf den Rebuild ist
# trotzdem richtig, und zwar aus einem nachgesehenen Grund:
# `@serialport/bindings-cpp` liefert **N-API**-Prebuilds
# (`prebuilds/<platform>/node.napi.*.node`). N-API ist ABI-stabil ueber Node-
# und Electron-Fassungen hinweg, die Binaerdatei passt also unveraendert in
# Electron 34. `usb` und `node-hid` liefern ebenso Prebuilds und sind
# zusaetzlich optional und lazy geladen (die Bruecke faengt ihr Fehlen ab).
# Waere eines davon ein klassisches NAN-Modul, muesste hier `true` stehen --
# und dann brauchte der Monorepo-Install die Loesung, die unten beschrieben
# ist. Wer eine native Abhaengigkeit OHNE N-API-Prebuild hinzufuegt, muss
# das hier aendern, sonst laedt sie im Installer nicht.
npmRebuild: false

# Aus einem asar-Archiv laesst sich KEIN natives Modul laden: `process.dlopen`
# braucht einen echten Pfad im Dateisystem, und im Archiv gibt es keinen.
# Ohne diese Zeilen startet die Bruecke im fertigen Installer nicht -- mit
# genau der Meldung, die `embeddedBridge.ts` abfaengt, also sichtbar, aber
# ohne Kamera. Die drei Module werden deshalb daneben ausgepackt.
asarUnpack:
  - "**/node_modules/@serialport/**"
  - "**/node_modules/serialport/**"
  - "**/node_modules/usb/**"
  - "**/node_modules/node-hid/**"
  - "**/*.node"

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: ../web-rcp/dist
    to: ui
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Camera Bridge
  runAfterFinish: true

mac:
  target:
    - dmg
  # `assets/icon.icns` stand hier und EXISTIERT NICHT. Aufgefallen ist das
  # nie, weil noch nie ein mac-Build gelaufen ist — der Eintrag war eine
  # Absichtserklaerung, keine Konfiguration, und der erste Lauf waere daran
  # abgebrochen.
  #
  # Jetzt zeigt er auf das PNG; electron-builder erzeugt daraus die .icns,
  # verlangt dafuer aber MINDESTENS 512x512. Das vorhandene Bild war 256x256
  # (ein Platzhalter, siehe assets/generate-icon.py) und ist deshalb auf 512
  # verdoppelt worden — nearest neighbour, ganzzahliger Faktor: dasselbe Bild
  # in gross, kein neues.
  icon: assets/icon.png
  category: public.app-category.video
  # Keine gekaufte Signatur. Die Ad-hoc-Signatur ist noetig, damit Gatekeeper
  # auf Apple Silicon die Anwendung ueberhaupt startet statt sie als
  # "beschaedigt" abzuweisen. CSC_IDENTITY_AUTO_DISCOVERY wird im Workflow
  # BEWUSST nicht auf false gesetzt: das Flag kuerzt die explizite Ad-hoc-
  # Identitaet ab, und heraus faellt ein voellig unsigniertes Programm.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  # Ohne diese Zeile heisst die Binaerdatei `@sony-camera-bridgeelectron-app`:
  # auf Linux leitet electron-builder den Namen vom PAKETnamen ab (hier ein
  # scoped Name, dessen Schraegstrich wegfaellt), nicht von `productName`.
  # Auf Windows und macOS faellt das nicht auf, weil dort `productName` zieht.
  executableName: camera-bridge
  target:
    - AppImage
  icon: assets/icon.png
  category: Video
