; B4LensControl — Waveshare ESP32-S3-ETH
;
; The platform is the pioarduino fork, not the stock espressif32 platform:
; Arduino-ESP32 core 3.x is required for native W5500 support through
; ETH.begin(ETH_PHY_W5500, …). Core 2.x needed LilyGO's out-of-tree ETHClass,
; which is what the factory demo on this board was built against.
; See docs/b4/runtime.md.

[platformio]
src_dir = src

[env:waveshare-esp32-s3-eth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16 MB flash, 8 MB OCTAL PSRAM (ESP32-S3R8). The octal setting is not
; cosmetic: it is why GPIO 33–37 are unavailable on this board.
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.8
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit BusIO @ ^1.16.1

; The armed build. Same code, drive compiled in. Flash this only once the
; readback is proven and a calibration table exists.
[env:waveshare-esp32-s3-eth-armed]
extends = env:waveshare-esp32-s3-eth
build_flags =
    ${env:waveshare-esp32-s3-eth.build_flags}
    -DB4_ENABLE_IRIS_DRIVE=1

; The lens serial line (group B): listen AND the transmit path compiled in.
; Built in CI so the TX code cannot rot, and so CI can check the default build
; does NOT contain it. Flash only per docs/b4/serial.md — the jumper, the level
; shifter and #47 come first.
[env:waveshare-esp32-s3-eth-serial]
extends = env:waveshare-esp32-s3-eth
build_flags =
    ${env:waveshare-esp32-s3-eth.build_flags}
    -DB4_ENABLE_SERIAL_RX=1
    -DB4_ENABLE_SERIAL_TX=1

; The demand as a USB HID gamepad (#52). Same code, plus TinyUSB: HID needs
; ARDUINO_USB_MODE=0 (USB-OTG) instead of the hardware CDC/JTAG of the default
; build. The console stays on USB-CDC as part of the same composite device.
[env:waveshare-esp32-s3-eth-demand-hid]
extends = env:waveshare-esp32-s3-eth
; The board definition passes -DARDUINO_USB_MODE=1 itself; without the unflag
; both reach the compiler and the later one wins only by accident of order.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -DB4_DEMAND_HID=1

; Classic ESP32 DevKit (ESP32-D0WD-V3, 4 MB flash, CP2102 USB-UART, no PSRAM,
; no Ethernet). The bench board in use from 2026-10-09: the network is WLAN
; (own access point, optionally also the house network), and the pins are the
; classic ESP32's, not the S3's. Pin map: docs/b4/pinout-esp32-devkit.md.
[env:esp32-devkit]
platform = ${env:waveshare-esp32-s3-eth.platform}
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DB4_BOARD_ESP32_DEVKIT=1
    -Wall
lib_deps = ${env:waveshare-esp32-s3-eth.lib_deps}

[env:esp32-devkit-armed]
extends = env:esp32-devkit
build_flags =
    ${env:esp32-devkit.build_flags}
    -DB4_ENABLE_IRIS_DRIVE=1
