; B4LensControl — Waveshare ESP32-S3-ETH
;
; The platform is the pioarduino fork, not the stock espressif32 platform:
; Arduino-ESP32 core 3.x is required for native W5500 support through
; ETH.begin(ETH_PHY_W5500, …). Core 2.x needed LilyGO's out-of-tree ETHClass,
; which is what the factory demo on this board was built against.
; See docs/b4/runtime.md.

[platformio]
src_dir = src

[env:waveshare-esp32-s3-eth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16 MB flash, 8 MB OCTAL PSRAM (ESP32-S3R8). The octal setting is not
; cosmetic: it is why GPIO 33–37 are unavailable on this board.
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.8
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit BusIO @ ^1.16.1

; The armed build. Same code, drive compiled in. Flash this only once the
; readback is proven and a calibration table exists.
[env:waveshare-esp32-s3-eth-armed]
extends = env:waveshare-esp32-s3-eth
build_flags =
    ${env:waveshare-esp32-s3-eth.build_flags}
    -DB4_ENABLE_IRIS_DRIVE=1
